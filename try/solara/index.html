<style>
  :root{
    --ground:#FCF6ED; --ink:#3D3352; --ink-soft:#9089A6; --coral:#F87768; --coral2:#FF9A62;
    --peach:#FFB36C; --lavender:#B9A8F0; --pink:#F7A6C4; --field:rgba(255,255,255,.72);
    --field-sel:#FFE3D8; --card:#fff; --shadow:0 10px 30px rgba(61,51,82,.10);
    --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
    --sans:ui-rounded,-apple-system,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
  /* FloFunnelBackground: sun halo top, pink glow right, lavender glow bottom-left */
  .sky{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(46vw 46vw at 50% -6%, rgba(255,179,108,.32), transparent 70%),
    radial-gradient(30vw 30vw at 92% 34%, rgba(247,166,196,.14), transparent 70%),
    radial-gradient(32vw 32vw at 6% 72%, rgba(185,168,240,.13), transparent 70%),
    var(--ground);}
  .app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 20px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 6px;min-height:52px}
  .back{width:36px;height:36px;border-radius:50%;border:0;background:var(--field);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;visibility:hidden;cursor:pointer}
  .back.on{visibility:visible}
  .bar{flex:1;height:6px;border-radius:3px;background:rgba(61,51,82,.10);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--coral),var(--coral2));transition:width .35s ease}
  .screen{flex:1;display:flex;flex-direction:column;animation:in .28s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hero{display:flex;justify-content:center;margin:18px 0 6px}
  .orb{width:150px;height:150px;filter:drop-shadow(0 14px 30px rgba(248,119,104,.35));animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .flood{margin:0 -20px 8px;overflow:hidden;position:relative}
  .flood img{width:100%;display:block;object-fit:cover}
  .flood:after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,var(--ground))}
  h1{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.12;letter-spacing:-.01em;margin:14px 0 8px;text-align:center}
  .sub{color:var(--ink-soft);font-size:17px;line-height:1.4;text-align:center;margin:0 0 18px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:18px;border:1.5px solid rgba(61,51,82,.10);background:var(--field);color:var(--ink);font:inherit;font-size:17px;font-weight:500;cursor:pointer;transition:transform .08s}
  .opt:active{transform:scale(.985)} .opt .em{font-size:22px;width:30px;text-align:center}
  .opt .t{flex:1} .opt small{display:block;color:var(--ink-soft);font-size:13px;font-weight:400;margin-top:3px}
  .opt .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(61,51,82,.14);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .opt.on{background:var(--field-sel);border-color:var(--coral)} .opt.on .ck{background:linear-gradient(135deg,var(--coral),var(--coral2));border-color:transparent}
  .field{width:100%;padding:16px;border-radius:22px;border:1.5px solid rgba(61,51,82,.10);background:var(--field);font:inherit;font-size:18px;color:var(--ink);outline:none}
  .field:focus{border-color:var(--coral)}
  .row{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:8px}
  .sel{-webkit-appearance:none;appearance:none;color:var(--ink-soft);padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%239089A6' stroke-width='2' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;font-size:17px;text-align:left}
  .sel.set{color:var(--ink);background-color:var(--field-sel);border-color:var(--coral)}
  .spacer{flex:1}
  .cta{width:100%;border:0;border-radius:999px;padding:17px 22px;font:inherit;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--coral),var(--coral2));box-shadow:0 10px 24px rgba(248,119,104,.35);cursor:pointer;margin-top:14px}
  .cta:disabled{opacity:.45;box-shadow:none}
  .skip{display:block;text-align:center;color:var(--ink-soft);margin:14px 0 0;background:none;border:0;font:inherit;font-size:15px;cursor:pointer;width:100%}
  .foot{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:12px}
  .tasks{margin:10px 0 0;padding:0;list-style:none} .tasks li{display:flex;gap:10px;align-items:center;padding:10px 0;color:var(--ink-soft);font-size:16px;opacity:.35;transition:opacity .3s}
  .tasks li.on{opacity:1;color:var(--ink)} .tasks li .d{width:22px;height:22px;border-radius:50%;background:rgba(61,51,82,.10);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .tasks li.done .d{background:linear-gradient(135deg,var(--coral),var(--coral2))}
  .facts{margin-top:18px;color:var(--ink-soft);font-size:13px;text-align:center;line-height:1.7}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
  .col{background:var(--field);border-radius:18px;padding:12px;font-size:14px}
  .col img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin-bottom:8px}
  .col h3{margin:0 0 6px;font-size:15px} .col ul{margin:0;padding-left:16px;color:var(--ink-soft)} .col.after ul{color:var(--ink)}
  /* landing (store-like card, our own design) */
  .store{padding-top:14px}
  .store .head{display:flex;gap:16px;align-items:center}
  .store .icon{width:96px;height:96px;border-radius:22px;box-shadow:var(--shadow);flex:none}
  .store h1{text-align:left;font-size:26px;margin:0 0 4px} .store .sub{text-align:left;margin:0;font-size:15px}
  .store .meta{display:flex;gap:18px;margin:18px 0 6px;color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .store .meta b{display:block;color:var(--ink);font-size:16px;text-transform:none;letter-spacing:0;font-family:var(--serif)}
  .shots{display:flex;gap:10px;overflow-x:auto;margin:14px -20px 6px;padding:6px 20px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .shots img{height:420px;border-radius:18px;box-shadow:var(--shadow);scroll-snap-align:start;flex:none}
  .store p.desc{color:var(--ink);font-size:15px;line-height:1.45}
  /* paywall */
  .pw .flood{margin-top:-8px} .pw .brand{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:-30px;position:relative}
  .pw .brand img{width:44px;height:44px;border-radius:12px} .pw .brand b{font-family:var(--serif);font-size:20px} .pw .brand em{font-style:normal;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:var(--field-sel);color:var(--coral)}
  .stats{display:flex;justify-content:center;gap:22px;margin:4px 0 12px;color:var(--ink-soft);font-size:12px;text-align:center} .stats b{display:block;color:var(--ink);font-size:16px;font-family:var(--serif)}
  .feat{margin:0 0 14px;padding:0;list-style:none} .feat li{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:16px} .feat li:before{content:"✓";color:var(--coral);font-weight:700}
  .plans{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .plan{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1.5px solid rgba(61,51,82,.10);background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
  .plan.on{border-color:var(--coral);background:var(--field-sel)} .plan .r{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(61,51,82,.16)} .plan.on .r{border:6px solid var(--coral)}
  .plan .t{flex:1} .plan .t b{font-size:17px} .plan .t small{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
  .plan .p{text-align:right} .plan .p b{font-size:17px} .plan .p small{display:block;color:var(--ink-soft);font-size:12px}
  .plan .badge{position:absolute;top:-10px;right:14px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:linear-gradient(90deg,var(--coral),var(--coral2));color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px} .chips span{font-size:13px;padding:7px 11px;border-radius:999px;background:var(--field);border:1px solid rgba(61,51,82,.08)}
  .legal{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:12px} .legal a{color:var(--ink-soft)}
  .wait{align-items:center;text-align:center;padding-top:40px} .wait .orb{width:120px;height:120px}
  .wait form{width:100%;margin-top:10px} .wait .ok{margin-top:24px;font-size:18px}
  .tiny{color:var(--ink-soft);font-size:12px;text-align:center;margin:10px 0 0}
  @media (min-width:700px){.app{margin:24px auto;min-height:calc(100% - 48px);border-radius:32px;background:rgba(255,255,255,.35);box-shadow:var(--shadow)}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="app">
  <div class="top"><button class="back" id="back" aria-label="Back">‹</button><div class="bar"><i id="bar"></i></div></div>
  <div id="screen" class="screen"></div>
</div>
<script src="/try/solara/app.js?v=3"></script>
</body></html>
