<style>
  /* ===== tokens = Atmo FloTheme (1 CSS px = 1 pt on the 430pt reference device) ===== */
  :root{
    --ground:#FCF6ED; --ink:#3D3352; --ink-soft:#9089A6; --coral:#F87768; --coral2:#FF9A62;
    --peach:#FFB36C; --lavender:#B9A8F0; --pink:#F7A6C4; --field:rgba(255,255,255,.78);
    --field-sel:#FFE3D8; --card:#fff; --good:#1FBB86; --shadow:0 8px 24px rgba(61,51,82,.08);
    --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
    --sans:ui-rounded,-apple-system,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif;
    --pad:24px; --topbar:58px;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  /* FloFunnelBackground: sun halo top-center, pink glow right, lavender glow bottom-left */
  .sky{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(46vw 46vw at 50% -6%, rgba(255,179,108,.32), transparent 70%),
    radial-gradient(30vw 30vw at 92% 34%, rgba(247,166,196,.14), transparent 70%),
    radial-gradient(32vw 32vw at 6% 72%, rgba(185,168,240,.13), transparent 70%),
    var(--ground);}
  .app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 var(--pad);position:relative}
  .top{height:calc(var(--topbar) + env(safe-area-inset-top));padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:flex-start;margin:0 -4px;position:relative;z-index:2}
  .back{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.62);color:var(--ink);display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .back.on{display:flex} .back svg{width:12px;height:18px}
  .screen{flex:1;display:flex;flex-direction:column;animation:in .28s ease}
  .screen.center{justify-content:center;padding-top:6vh}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* titles: serif semibold, 28 left (questions) / 30 centered (info) */
  h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.14;letter-spacing:-.01em;margin:0 0 8px;text-align:left}
  .c h1{text-align:center;font-size:30px}
  .sub{color:var(--ink-soft);font-size:15px;line-height:1.35;margin:0 0 18px;text-align:left}
  .c .sub{text-align:center;padding:0 6px}
  .hero{display:flex;justify-content:center;margin:0 0 22px}
  .orbwrap{position:relative;display:inline-block;animation:float 4s ease-in-out infinite}
  .orbwrap .orb{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 26px rgba(248,119,104,.28))}
  .orbwrap .face{position:absolute;inset:0;width:100%;height:100%}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .emoji{font-size:84px;line-height:1;text-align:center;margin:0 0 26px}
  /* full-bleed artwork on info/permission steps: starts under the (transparent) top bar */
  .flood{margin:calc(-1 * var(--topbar) - env(safe-area-inset-top)) calc(-1 * var(--pad)) 18px;position:relative;overflow:hidden}
  .flood img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .flood:after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,var(--ground))}
  /* options */
  .opts{display:flex;flex-direction:column;gap:10px;margin:2px 0 12px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:14px 16px;border-radius:16px;border:1.5px solid transparent;background:var(--field);color:var(--ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s}
  .opt:active{transform:scale(.985)} .opt .em{font-size:20px;width:26px;text-align:center}
  .opt .t{flex:1;line-height:1.25} .opt small{display:none;color:var(--ink-soft);font-size:13px;font-weight:400;margin-top:3px;line-height:1.3}
  .opt.on small{display:block}
  .opt .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(61,51,82,.16);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex:none}
  .opt.on{background:var(--field-sel);border-color:var(--coral)} .opt.on .ck{background:linear-gradient(135deg,var(--coral),var(--coral2));border-color:transparent}
  .field{width:100%;height:52px;padding:0 16px;border-radius:16px;border:1.5px solid transparent;background:var(--field);font:inherit;font-size:16px;color:var(--ink);outline:none;text-align:center}
  .field::placeholder{color:rgba(144,137,166,.7)} .field:focus{border-color:var(--coral)}
  .row{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:8px}
  .sel{-webkit-appearance:none;appearance:none;color:var(--ink-soft);text-align:left;padding-right:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%239089A6' stroke-width='2' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;font-size:15px}
  .sel.set{color:var(--ink);background-color:var(--field-sel);border-color:var(--coral)}
  .spacer{flex:1;min-height:14px}
  /* sticky action bar: CTA never leaves the screen (as in the app), content scrolls beneath */
  .ctabar{position:sticky;bottom:0;margin:0 calc(-1 * var(--pad));padding:8px var(--pad) calc(22px + env(safe-area-inset-bottom));background:linear-gradient(to bottom, rgba(252,246,237,0), var(--ground) 30%)}
  .pw .ctabar{padding-top:14px}
  .cta{width:100%;height:56px;border:0;border-radius:999px;padding:0 22px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--coral),var(--coral2));box-shadow:0 8px 20px rgba(248,119,104,.28);cursor:pointer;transition:opacity .2s}
  .cta:disabled{opacity:.48;box-shadow:none}
  .skip{display:block;text-align:center;color:var(--ink-soft);margin:12px 0 0;background:none;border:0;font:inherit;font-size:15px;cursor:pointer;width:100%}
  .foot{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--ink-soft);font-size:12px;text-align:center;margin:0 0 14px}
  .bd{width:14px;height:14px;border-radius:50%;background:var(--coral);color:#fff;font-size:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .tiny{color:var(--ink-soft);font-size:12px;text-align:center;margin:10px 0 0;line-height:1.4}
  /* progress step (ProgressStepView) */
  .ptasks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:22px}
  .ptasks li{opacity:.3;transition:opacity .35s,transform .35s;transform-origin:left center}
  .ptasks li.active{opacity:1;transform:scale(1.02)} .ptasks li.done{opacity:.7}
  .ptasks .row2{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:8px}
  .ptasks li:not(.active):not(.done) .lbl{color:var(--ink-soft)}
  .ptasks .chk{width:20px;height:20px;border-radius:50%;background:var(--coral);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;transform:scale(.4);opacity:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s}
  .ptasks li.done .chk{transform:scale(1);opacity:1}
  .ptasks .track{height:6px;border-radius:3px;background:rgba(248,119,104,.14);overflow:hidden}
  .ptasks .track i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--coral),var(--coral2));transition:width 1s ease}
  .facts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
  .facts div{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:14px;padding:13px 14px;font-size:14px;color:var(--ink);animation:in .4s ease}
  .facts .bd{width:18px;height:18px;font-size:10px}
  /* comparison (before/after) */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:52px 0 12px;align-items:start}
  .col{position:relative;border-radius:20px;padding:46px 14px 16px;background:var(--field);font-size:15px}
  .col.after{background:#FFF3EE;border:1.5px solid var(--coral);box-shadow:0 10px 26px rgba(248,119,104,.18)}
  .col .por{position:absolute;top:-36px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 6px 16px rgba(61,51,82,.16)}
  .col h3{margin:0 0 8px;font-size:15px;font-weight:700;color:var(--ink-soft)} .col.after h3{color:var(--coral)}
  .col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .col li{display:flex;gap:8px;align-items:flex-start;color:var(--ink-soft);line-height:1.3} .col.after li{color:var(--ink);font-weight:600}
  .col li .i{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:rgba(144,137,166,.45)}
  .col.after li .i{background:var(--coral)}
  /* landing (our own store-like card) */
  .store{padding-top:6px}
  .store .head{display:flex;gap:16px;align-items:center}
  .store .icon{width:96px;height:96px;border-radius:22px;box-shadow:var(--shadow);flex:none}
  .store h1{font-size:26px;margin:0 0 4px} .store .sub{margin:0;font-size:14px}
  .store .meta{display:flex;gap:18px;margin:18px 0 6px;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .store .meta b{display:block;color:var(--ink);font-size:15px;text-transform:none;letter-spacing:0;font-family:var(--serif)}
  .shots{display:flex;gap:10px;overflow-x:auto;margin:14px calc(-1 * var(--pad)) 6px;padding:6px var(--pad) 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .shots img{height:400px;border-radius:18px;box-shadow:var(--shadow);scroll-snap-align:start;flex:none}
  .store p.desc{color:var(--ink);font-size:15px;line-height:1.45}
  /* paywall (light Flo paywall: brand row, serif title, stats card, plan cards, trial timeline) */
  .pw{padding-top:2px}
  .pw .close{position:absolute;right:var(--pad);top:calc(12px + env(safe-area-inset-top));width:34px;height:34px;border-radius:50%;background:rgba(61,51,82,.10);border:0;color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center;z-index:3}
  .pw .brand{display:flex;align-items:center;gap:8px;margin:2px 0 16px} .pw .brand .orbwrap{animation:none}
  .pw .brand b{font-size:17px;font-weight:600} .pw .brand em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:var(--coral);color:#fff}
  .pw h1{font-size:31px;text-align:left;margin-bottom:10px;letter-spacing:-.015em} .pw .sub{font-size:14.5px;text-align:left;color:var(--ink);opacity:.8;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-radius:16px;padding:12px 6px;margin:0 0 14px;text-align:center}
  .stats span{border-left:1px solid rgba(61,51,82,.10)} .stats span:first-child{border:0}
  .stats b{display:block;font-size:17px;font-weight:700} .stats small{color:var(--ink-soft);font-size:11px}
  .plans{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .plan{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border-radius:16px;border:1.5px solid transparent;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
  .plan.on{border-color:var(--coral)}
  .plan .r{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(61,51,82,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:none}
  .plan.on .r{border-color:transparent;background:linear-gradient(135deg,var(--coral),var(--coral2))}
  .plan .t{flex:1} .plan .t b{font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px} .plan .t small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:2px}
  .plan .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--coral);color:#fff;letter-spacing:.02em}
  .plan .p{text-align:right} .plan .p b{font-size:16px;font-weight:600} .plan .p small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px}
  .tl{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .tl .step{display:flex;gap:12px;align-items:flex-start;padding:6px 0;position:relative}
  .tl .step .ic{width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;z-index:1} .tl .step .ic svg{width:14px;height:14px;fill:#fff}
  .tl .step:not(:last-child):after{content:"";position:absolute;left:13px;top:34px;bottom:-6px;width:2px;background:rgba(248,119,104,.28)}
  .tl .step b{display:block;font-size:14.5px} .tl .step span{color:var(--ink-soft);font-size:12.5px;line-height:1.3}
  .feat{margin:0 0 12px;padding:14px 16px;list-style:none;background:var(--card);border-radius:16px;display:flex;flex-direction:column;gap:9px} .feat li{display:flex;gap:10px;align-items:center;font-size:14.5px} .feat li:before{content:"✓";color:var(--coral);font-weight:700}
  .inc{font-size:12px;color:var(--ink-soft);margin:4px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px} .chips span{font-size:13px;padding:7px 11px;border-radius:999px;background:var(--field)}
  .green{display:flex;justify-content:center;align-items:center;gap:7px;font-size:13px;color:var(--ink);margin:0 0 12px} .green .g{width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
  .legal{color:var(--ink-soft);font-size:11px;text-align:center;margin:10px 0 0} .legal a{color:var(--ink-soft);text-decoration:none} .legal i{font-style:normal;opacity:.7}
  /* waitlist */
  .wait{align-items:center;text-align:center} .wait form{width:100%;margin-top:6px}
  @media (min-width:700px){.app{margin:24px auto;min-height:calc(100% - 48px);border-radius:32px;background:rgba(255,255,255,.35);box-shadow:var(--shadow)}}
</style>

<body>
<div class="sky"></div>
<div class="app">
  <div class="top"><button class="back" id="back" aria-label="Back"><svg viewBox="0 0 12 18" fill="none" stroke="#3D3352" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2 2.5 9l7 7"/></svg></button></div>
  <div id="screen" class="screen"></div>
</div>
<script src="/try/solara/app.js?v=9"></script>
