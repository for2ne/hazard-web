<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara — Opening the App Store…</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Solara: Daily Energy Forecast">
<meta property="og:description" content="Weather, magnetic storms and your own rhythms — one personal forecast every morning, checked against how you actually felt.">
<meta property="og:image" content="https://hazard.studio/img/atmo/solara-icon.png">
<meta property="og:url" content="https://hazard.studio/go/solara/">
<style>
  :root{--cream:#fdf6ec;--ink:#2b2440;--soft:#7a7290;--coral:#e8734a}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--cream);color:var(--ink);
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .wrap{max-width:360px}
  .icon{width:112px;height:112px;border-radius:26px;box-shadow:0 10px 30px rgba(43,36,64,.18);margin:0 auto 20px;display:block;background:#fff}
  .icon-fallback{font-size:72px;line-height:112px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
  p{margin:0 0 22px;color:var(--soft);font-size:16px;line-height:1.4}
  .dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--coral);opacity:.3;animation:pulse 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.9)}40%{opacity:1;transform:scale(1.1)}}
  .btn{display:inline-block;margin-top:26px;background:var(--coral);color:#fff;text-decoration:none;font-weight:600;
       padding:15px 28px;border-radius:999px;font-size:17px;box-shadow:0 6px 18px rgba(232,115,74,.35)}
  .fine{margin-top:22px;font-size:12px;color:var(--soft)}
  .fine a{color:var(--soft)}
</style>
<script>
  // Bridge page for paid campaigns (Meta → web → store). Branded, visible fallback
  // button — never a bare 0-second redirect (those get flagged as bridge pages).
  // It waits until the Meta Pixel has really run (it sets _fbp, and _fbc when the URL
  // carries fbclid) so the landing page view is registered and the click id travels
  // on to Adapty / the app — but never longer than maxWaitMs (22.09: was a fixed 1.8 s,
  // which sometimes redirected before the pixel loaded → lost fbc → Meta can't attribute
  // Adapty's CAPI events to the click). All click params (fbclid, utm_*) are forwarded.
  var CONFIG = {
    pixelId: "2131738047419101",                                          // Meta Pixel ID; empty = pixel off
    adaptyClick: "https://api-ua.adapty.io/api/v1/attribution/click",     // Adapty Attribution tracking link (created 20.09.2026)
    adaptyCid: "MTAxMDY6MTc1OTE6OTkz",
    storeUrl: "https://apps.apple.com/app/apple-store/id6802366596",      // App Analytics campaign link: pt = provider token, ct = batch (utm_campaign)
    providerToken: "123393606",
    minWaitMs: 1200,        // keep the branded screen visible at least this long
    maxWaitMs: 7000         // hard cap: redirect even if the pixel never loads (blockers, slow in-app browser)
  };
  // Meta macros ({{ad.id}} …) only resolve on the ad's own destination URL, so the quiz/ad forwards them as query params
  // (campaign_id, adset_id, ad_id, campaign_name, adset_name; ad_name = utm_content) and this page rebuilds the Adapty link.
  function buildTarget(params, ids) {
    ids = ids || {};
    var g = function (k, alt) { return params.get(k) || (alt ? params.get(alt) : "") || ""; };
    var q = new URLSearchParams();
    q.set("adpt_cid", CONFIG.adaptyCid);
    q.set("campaign_id", g("campaign_id")); q.set("adset_id", g("adset_id")); q.set("ad_id", g("ad_id"));
    q.set("campaign_name", g("campaign_name", "utm_campaign")); q.set("adset_name", g("adset_name")); q.set("ad_name", g("ad_name", "utm_content"));
    ["fbclid", "variant", "plan", "via", "utm_source"].forEach(function (k) { if (params.get(k)) q.set(k, params.get(k)); });
    // One person = one id from the click on: the quiz used to mint web_uid; since 22.09 ads go straight through this bridge,
    // so the bridge mints it (or reuses the quiz's / a previous visit's). The app identifies Mixpanel + Adapty with it (1.0.1).
    q.set("web_uid", ids.web_uid || params.get("web_uid") || "");
    // Meta browser/click ids from the pixel cookies (_fbp / _fbc) — passed on so Adapty (if it forwards them) or our own
    // CAPI relay can send events with fbc/fbp = click-level attribution instead of IP/UA matching.
    if (ids.fbp) q.set("fbp", ids.fbp);
    if (ids.fbc) q.set("fbc", ids.fbc);
    // Adapty delivers custom click data to the app ONLY via ios_deferred_data / android_deferred_data
    // (verified on TestFlight 1.0.1, 21.09): one string → the app parses JSON. Keep it short.
    var deferred = {};
    ["variant", "fbclid", "plan", "via"].forEach(function (k) { if (params.get(k)) deferred[k] = params.get(k); });
    deferred.web_uid = ids.web_uid || params.get("web_uid") || undefined;
    if (ids.fbc) deferred.fbc = ids.fbc;
    if (ids.fbp) deferred.fbp = ids.fbp;
    deferred.ad_name = g("ad_name", "utm_content"); deferred.campaign_name = g("campaign_name", "utm_campaign");
    var deferredJson = JSON.stringify(deferred);
    q.set("ios_deferred_data", deferredJson); q.set("android_deferred_data", deferredJson);
    var ct = (g("ct", "utm_campaign") || "web").replace(/[^A-Za-z0-9_.-]/g, "").slice(0, 40);   // ASC Campaigns row = batch
    // Custom Product Page per creative angle: the ad link carries ppid=<appCustomProductPages id> (asc/cpp.py list); absent → default page
    var ppid = (params.get("ppid") || "").replace(/[^A-Za-z0-9-]/g, "").slice(0, 40);
    q.set("redirect_url", CONFIG.storeUrl + "?pt=" + CONFIG.providerToken + "&ct=" + ct + "&mt=8" + (ppid ? "&ppid=" + ppid : ""));
    return CONFIG.adaptyClick + "?" + q.toString();
  }
</script>
</head>
<body>
<div class="wrap">
  <img class="icon" src="/img/atmo/solara-icon.png" alt="Solara"
       onerror="this.outerHTML='<div class=&quot;icon icon-fallback&quot;>☀️</div>'">
  <h1>Solara</h1>
  <p>Taking you to the App Store…</p>
  <div class="dots"><span></span><span></span><span></span></div>
  <a class="btn" id="go" href="https://apps.apple.com/app/id6802366596">Open in App Store</a>
  <div class="fine">Daily Energy Forecast · <a href="/apps/solara/privacy.html">Privacy</a></div>
</div>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    // Keep the click context for a future web quiz step (same origin)
    try {
      ["fbclid", "utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"].forEach(function (k) {
        if (params.has(k)) localStorage.setItem("solara." + k, params.get(k));
      });
    } catch (e) {}

    function cookie(name) { var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : ""; }
    function uuid() { try { return crypto.randomUUID(); } catch (e) { return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }); } }
    // web_uid: from the quiz if it sent one, else the one this browser got before, else a fresh UUID (kept for repeat clicks)
    var webUid = params.get("web_uid") || "";
    try { webUid = webUid || localStorage.getItem("solara.web_uid") || ""; if (!webUid) { webUid = uuid(); } localStorage.setItem("solara.web_uid", webUid); } catch (e) { webUid = webUid || uuid(); }
    var start = Date.now(), fired = false;
    document.getElementById("go").href = buildTarget(params, { web_uid: webUid });   // fallback button works from the first frame
    // Mixpanel: the click itself, under the same id the app will identify with (HTTP track, no SDK → nothing to wait for)
    function mpTrack(event, props) {
      try {
        var payload = { event: event, properties: Object.assign({ token: "c9185ff47f6235fb0e3e3effab258e84", distinct_id: webUid, $insert_id: webUid.slice(0, 8) + "-" + Date.now(),
          platform: "web", page: "bridge", utm_source: params.get("utm_source") || "", utm_campaign: params.get("utm_campaign") || "", utm_content: params.get("utm_content") || "",
          ad_name: params.get("ad_name") || params.get("utm_content") || "", campaign_id: params.get("campaign_id") || "", adset_id: params.get("adset_id") || "", ad_id: params.get("ad_id") || "",
          has_fbclid: params.has("fbclid"), web_uid: webUid }, props || {}) };
        var body = "data=" + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload))))) + "&ip=1";
        if (navigator.sendBeacon) navigator.sendBeacon("https://api.mixpanel.com/track", new Blob([body], { type: "application/x-www-form-urlencoded" }));
        else fetch("https://api.mixpanel.com/track", { method: "POST", body: body, headers: { "Content-Type": "application/x-www-form-urlencoded" }, keepalive: true });
      } catch (e) {}
    }
    mpTrack("bridge_view");
    function go() {
      if (fired) return; fired = true;
      var url = buildTarget(params, { fbp: cookie("_fbp"), fbc: cookie("_fbc"), web_uid: webUid });
      document.getElementById("go").href = url;
      mpTrack("bridge_redirect", { waited_ms: Date.now() - start, has_fbc: !!cookie("_fbc"), has_fbp: !!cookie("_fbp") });
      location.replace(url);
    }

    if (CONFIG.pixelId) {
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', CONFIG.pixelId);
      fbq('track', 'PageView');
      fbq('trackCustom', 'StoreRedirect', { app: 'solara' });
    }

    // Redirect as soon as the pixel has done its job (cookies present) and the branded screen was up ≥ minWaitMs;
    // otherwise at maxWaitMs regardless. Without a pixel there is nothing to wait for.
    var needFbc = params.has("fbclid");
    (function tick() {
      var elapsed = Date.now() - start;
      var ready = !!cookie("_fbp") && (!needFbc || !!cookie("_fbc"));
      if (!CONFIG.pixelId || (ready && elapsed >= CONFIG.minWaitMs) || elapsed >= CONFIG.maxWaitMs) return go();
      setTimeout(tick, 100);
    })();
  })();
</script>
</body></html>
